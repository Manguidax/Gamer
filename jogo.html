<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mangui Dx Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d4ff;
            --neon-green: #39ff14;
            --bg-deep: #080a0c;
            --card-bg: #111418;
            --border: #1e242b;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --star-gold: #ffb400;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            padding-bottom: 60px;
            font-size: 13px;
        }

        .clickable { transition: all 0.15s ease; cursor: pointer; }
        .clickable:active { transform: scale(0.97); }

        header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; }
        .back-btn { font-size: 24px; color: var(--neon-blue); text-decoration: none; }

        .hero { display: flex; padding: 0 20px; gap: 15px; align-items: center; margin-bottom: 10px; }
        .game-icon { width: 70px; height: 70px; border-radius: 16px; border: 1px solid var(--border); object-fit: cover; }
        .hero h1 { margin: 0; font-size: 17px; font-weight: 800; }
        .lang-tag { font-size: 10px; color: var(--neon-blue); font-weight: 800; text-transform: uppercase; }

        .gpu-tag {
            margin: 0 20px 15px; padding: 10px; text-align: center; border-radius: 8px;
            border: 1px solid var(--border); background: rgba(255, 255, 255, 0.02);
        }
        .gpu-active { border: 1px solid var(--neon-blue); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 5px var(--neon-blue); } 50% { box-shadow: 0 0 12px var(--neon-blue); } }

        /* TEXTO DO BOTÃO AJUSTADO PARA "INSTALAR" */
        .btn-inst {
            background: var(--neon-blue); color: #000; border: none; width: 160px;
            padding: 12px; border-radius: 50px; font-size: 11px; font-weight: 800;
            text-transform: uppercase; margin: 10px auto; display: block;
        }

        #dl-list { display: none; padding: 0 20px; margin-bottom: 20px; }
        .dl-card {
            background: var(--card-bg); border: 1px solid var(--border); padding: 12px;
            border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
        }
        .recommended-gpu { border: 1px solid var(--neon-blue) !important; background: linear-gradient(90deg, #111418, #002a33) !important; }
        .legend-file { border: 1px solid var(--neon-green); background: linear-gradient(90deg, #111418, #0a2408); }

        .tab { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-weight: 600; }
        .tab-content { display: none; padding: 0 20px 12px; color: var(--text-secondary); font-size: 12px; line-height: 1.5; }

        .video-box { padding: 20px; }
        .video-box iframe { width: 100%; height: 180px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 10px; }

        .yt-comment-btn {
            background: #ff0000; color: #fff; border: none; width: 100%; padding: 14px;
            border-radius: 12px; font-weight: 800; font-size: 11px; display: flex;
            align-items: center; justify-content: center; gap: 8px;
        }

        .h-scroll { display: flex; overflow-x: auto; padding: 0 20px 20px; gap: 10px; scrollbar-width: none; }
        .rel-item { min-width: 85px; text-align: center; }
        .rel-item img { width: 85px; height: 85px; border-radius: 12px; border: 1px solid var(--border); object-fit: cover; }

        .footer { text-align: center; padding: 20px; font-size: 9px; color: var(--text-secondary); opacity: 0.5; }
    </style>
</head>
<body>

    <header>
        <div class="back-btn clickable" onclick="window.location.href='index.html'">‹</div>
        <div style="font-size: 9px; font-weight: 800; color: var(--text-secondary);">MANGUI DX STORE</div>
        <div style="width: 24px;"></div>
    </header>

    <div class="hero">
        <img src="" id="game-img" class="game-icon">
        <div class="hero-txt">
            <h1 id="game-title">Carregando...</h1>
            <span id="game-lang" class="lang-tag"></span>
        </div>
    </div>

    <div id="gpu-container" class="gpu-tag">
        <span id="hw-model" style="color: #fff; font-size: 11px;">Detectando...</span>
        <span id="hw-gpu" style="color: var(--neon-blue); font-size: 9px; display: block;">Analisando Hardware</span>
    </div>

    <!-- BOTÃO CORRIGIDO PARA "INSTALAR" -->
    <button class="btn-inst clickable" id="inst-btn" onclick="startDL()">Instalar</button>
    
    <div id="dl-list">
        <p style="font-size: 10px; color: var(--neon-blue); font-weight: 800; margin-bottom: 12px;">LINKS DISPONÍVEIS:</p>
        <div id="links-container"></div>
    </div>

    <div class="tab clickable" onclick="toggle('desc-box')">Sobre o jogo <span>+</span></div>
    <div id="desc-box" class="tab-content"></div>

    <div class="tab clickable" onclick="toggle('req-box')">Requisitos Técnicos <span>+</span></div>
    <div id="req-box" class="tab-content"></div>

    <!-- VÍDEO DO ENCURTADOR FIXO -->
    <div class="video-box">
        <p style="font-size: 11px; color: var(--neon-green); font-weight: 800; margin-bottom: 10px; text-align: center;">
            TUTORIAL: COMO PASSAR PELO LINKVERTISE
        </p>
        <iframe src="https://www.youtube.com/embed/0bMlw7H3U2k" allowfullscreen></iframe>
    </div>

    <!-- VÍDEO DO JOGO -->
    <div class="video-box" id="vid-container">
        <p style="font-size: 11px; color: var(--text-secondary); font-weight: 800; margin-bottom: 10px; text-align: center;">
            GAMEPLAY / TRAILER
        </p>
        <iframe id="game-video" src="" allowfullscreen></iframe>
    </div>

    <div class="rating-section" style="padding: 20px; border-top: 1px solid var(--border);">
        <h3 style="font-size: 13px; margin-bottom: 5px;">Feedback Mangui Dx</h3>
        <div style="color: var(--star-gold); margin-bottom: 12px;">★★★★★</div>
        <button id="yt-btn" class="yt-comment-btn clickable">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg" width="18">
            COMENTAR NO VÍDEO
        </button>
    </div>

    <div class="h-scroll" id="rel-list"></div>
    <div class="footer">© 2024 Mangui Dx Hub</div>

    <script src="jogos.js"></script>
    <script>
        let userGPU = "GENÉRICA";

        function detectHardware() {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            let gpuName = "DESCONHECIDA";
            if (gl) {
                const debug = gl.getExtension('WEBGL_debug_renderer_info');
                if (debug) gpuName = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL).toUpperCase();
            }
            
            if (gpuName.includes("ADRENO")) userGPU = "ADRENO";
            else if (gpuName.includes("MALI") || gpuName.includes("BIFROST") || gpuName.includes("VALHALL")) userGPU = "MALI";
            else if (gpuName.includes("POWERVR") || gpuName.includes("ROGUE")) userGPU = "POWERVR";

            document.getElementById('hw-model').innerText = navigator.userAgent.includes("Android") ? "Android Device" : "Smartphone";
            document.getElementById('hw-gpu').innerText = gpuName;
            document.getElementById('gpu-container').classList.add('gpu-active');
        }

        function carregar() {
            detectHardware();
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const game = games.find(g => g.id === id) || games[0];

            document.getElementById('game-title').innerText = game.title;
            document.getElementById('game-img').src = game.image;
            
            // CORREÇÃO DA LÍNGUA: Se não houver língua no jogos.js, não mostra "Português" por padrão.
            document.getElementById('game-lang').innerText = game.language || "";
            
            document.getElementById('desc-box').innerText = game.description;

            const btnYT = document.getElementById('yt-btn');
            if(game.youtubeId && game.youtubeId !== "") {
                document.getElementById('game-video').src = "https://www.youtube.com/embed/" + game.youtubeId;
                btnYT.onclick = () => window.open(`https://www.youtube.com/watch?v=${game.youtubeId}`, '_blank');
            } else {
                document.getElementById('vid-container').style.display = "none";
                btnYT.onclick = () => {
                    const busca = encodeURIComponent("Mangui Dx " + game.title);
                    window.open(`https://www.youtube.com/results?search_query=${busca}`, '_blank');
                };
            }

            document.getElementById('req-box').innerHTML = `<b>Android:</b> ${game.requirements.android}+<br><b>RAM:</b> ${game.requirements.ram}<br><b>Sua GPU:</b> ${userGPU}`;

            const container = document.getElementById('links-container');
            container.innerHTML = "";
            game.downloads.forEach(dl => {
                const n = dl.name.toUpperCase();
                const isMatch = (userGPU !== "GENÉRICA" && n.includes(userGPU));
                const isLegend = n.includes("LEGENDA") || n.includes("TRADUÇÃO");

                const div = document.createElement('div');
                div.className = `dl-card clickable ${isMatch ? 'recommended-gpu' : ''} ${isLegend ? 'legend-file' : ''}`;
                div.innerHTML = `
                    <div>
                        <b>${dl.name}</b><br>
                        <small style="color:${isMatch ? 'var(--neon-blue)' : (isLegend ? 'var(--neon-green)' : 'var(--text-secondary)')}">
                            ${isMatch ? '★ RECOMENDADO PARA TUA GPU' : (isLegend ? '⬇ TRADUÇÃO' : dl.type)}
                        </small>
                    </div>
                    <span>❯</span>`;
                div.onclick = () => window.open(dl.url, '_blank');
                container.appendChild(div);
            });

            const rel = document.getElementById('rel-list');
            games.filter(g => g.id !== id).sort(() => 0.5 - Math.random()).slice(0, 8).forEach(g => {
                const item = document.createElement('div');
                item.className = "rel-item clickable";
                item.innerHTML = `<img src="${g.image}"><span>${g.title}</span>`;
                item.onclick = () => window.location.href = `jogo.html?id=${g.id}`;
                rel.appendChild(item);
            });
        }

        function startDL() {
            let t = 3;
            const btn = document.getElementById('inst-btn');
            const itv = setInterval(() => {
                btn.innerText = "VERIFICANDO " + t + "s";
                if(t <= 0) {
                    clearInterval(itv);
                    btn.style.display = "none";
                    document.getElementById('dl-list').style.display = "block";
                }
                t--;
            }, 1000);
        }

        function toggle(id) {
            const e = document.getElementById(id);
            e.style.display = (e.style.display === "block") ? "none" : "block";
        }

        window.onload = carregar;
    </script>
</body>
</html>
