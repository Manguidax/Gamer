
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mangui Dx Hub</title>
    <style>
        :root { --bg: #f1f3f4; --card: #ffffff; --border: #dadce0; --text: #202124; --green: #01875f; --yt-red: #ff0000; }
        .dark-mode { --bg: #080a0c; --card: #111418; --border: #1e242b; --text: #ffffff; --green: #3b82f6; }
        
        body { font-family: "Times New Roman", serif; margin: 0; padding-bottom: 95px; background: var(--bg); color: var(--text); transition: 0.3s; font-size: 16px; overflow-x: hidden; }

        header { display: grid; grid-template-columns: auto 1fr auto; align-items: center; padding: 12px 15px; background: var(--card); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border); gap: 10px; }
        .search-box { display: flex; align-items: center; background: var(--bg); border-radius: 25px; padding: 6px 15px; border: 1px solid var(--border); }
        .search-box input { width: 100%; border: none; background: none; color: var(--text); outline: none; font-size: 15px; }

        .sub-nav { display: flex; gap: 18px; padding: 12px 15px; background: var(--card); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
        .sub-item { font-size: 14px; font-weight: bold; color: #5f6368; white-space: nowrap; cursor: pointer; text-transform: uppercase; }

        /* CARROSSEL PREMIUM COM CARTAZ */
        .carousel-wrap { padding: 15px; overflow: hidden; position: relative; }
        .carousel { display: flex; transition: transform 0.5s ease-in-out; }
        .c-item { min-width: 100%; position: relative; border-radius: 20px; overflow: hidden; height: 210px; cursor: pointer; }
        .c-bg { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); }
        
        /* O CARTAZ QUE FALTAVA */
        .c-cartaz { 
            position: absolute; bottom: 15px; left: 15px; right: 15px; 
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(12px); 
            padding: 12px; border-radius: 15px; display: flex; align-items: center; 
            gap: 12px; border: 1px solid rgba(255,255,255,0.1); 
        }
        .c-logo { width: 50px; height: 50px; border-radius: 10px; border: 2px solid #fff; object-fit: cover; }
        .c-plat { background: var(--green); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 5px; font-weight: bold; text-transform: uppercase; margin-bottom: 3px; display: inline-block; }
        .c-title { color: #fff; font-size: 16px; font-weight: bold; display: block; }

        /* CAPAS DE JOGOS */
        .pop-img { width: 140px; height: 140px; border-radius: 22px; object-fit: cover; border: 1px solid var(--border); }
        .sug-img { width: 70px; height: 70px; border-radius: 14px; object-fit: cover; }

        /* YOUTUBE SECTION */
        .yt-section { background: var(--yt-red); padding: 25px 15px; margin-top: 25px; color: #fff; text-align: center; }
        .btn-yt { background: #fff; color: var(--yt-red); border: none; padding: 12px 25px; border-radius: 30px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 15px; font-size: 14px; }

        /* POPUPS */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 5000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal { background: var(--card); width: 88%; max-width: 400px; border-radius: 25px; padding: 22px; text-align: center; }
        .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-height: 280px; overflow-y: auto; padding: 5px; }
        .opt-btn { padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-weight: bold; cursor: pointer; font-size: 13px; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--border); height: 70px; z-index: 1000; }
        .b-btn { background: none; border: none; color: #5f6368; font-size: 12px; font-weight: bold; flex: 1; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        
        #google_translate_element { display: none !important; }
    </style>
</head>
<body onload="carregarTudo()">

    <header>
        <b style="color:var(--green); font-size:20px;">Mangui Dx</b>
        <div class="search-box">
            <input type="text" id="top-search" placeholder="Search games..." onkeypress="if(event.key==='Enter') buscar(this.value)">
            <button onclick="buscar(document.getElementById('top-search').value)" style="background:none; border:none; cursor:pointer;"></button>
        </div>
        <button onclick="document.body.classList.toggle('dark-mode')" style="background:none; border:none; font-size:22px; cursor:pointer;"></button>
    </header>

    <nav class="sub-nav">
        <span class="sub-item" onclick="location.reload()">Para Você</span>
        <span class="sub-item" onclick="mostrarFiltro('category')">Categorias</span>
        <span class="sub-item" onclick="mostrarFiltro('platform')">Plataformas</span>
        <span class="sub-item" onclick="abrirIdiomas()">Idioma</span>
    </nav>

    <div class="carousel-wrap">
        <div class="carousel" id="slider"></div>
    </div>

    <h3 style="padding:0 15px; font-size:18px; color:var(--green);">Sugeridos para Ti</h3>
    <div id="main-list" style="padding:0 15px;"></div>

    <h3 style="padding:15px 15px 0 15px; font-size:18px; color:var(--green);">Mais Populares</h3>
    <div style="display: flex; overflow-x: auto; padding: 15px; gap: 18px; scrollbar-width: none;" id="pop-list"></div>

    <div class="yt-section">
        <h2 style="margin:0 0 15px 0;">VÍDEOS DO CANAL</h2>
        <div id="yt-content" style="background: rgba(0,0,0,0.2); border-radius: 20px; padding: 15px;"></div>
        <button class="btn-yt" onclick="window.open('https://youtube.com/@manguidx')">Visitar YouTube</button>
    </div>

<!-- POPUP IDIOMA -->
<div id="lang-popup" class="overlay">
    <div class="modal">
        <h3>Select Language</h3>

        <input 
            type="text" 
            id="lang-search" 
            style="width:100%; padding:12px; border-radius:15px; border:1px solid var(--border); margin-bottom:15px;" 
            placeholder="Search..." 
            onkeyup="filtrarListaIdiomas()"
        >

        <div class="grid-options" id="lang-grid">

            <!-- PRINCIPAIS -->
            <button class="opt-btn" onclick="setLang('pt')"> PT</button>
            <button class="opt-btn" onclick="setLang('en')"> EN</button>
            <button class="opt-btn" onclick="setLang('es')"> ES</button>
            <button class="opt-btn" onclick="setLang('fr')"> FR</button>
            <button class="opt-btn" onclick="setLang('de')"> DE</button>

            <!-- OUTROS IDIOMAS -->
            <button class="opt-btn" onclick="setLang('it')"> IT</button>
            <button class="opt-btn" onclick="setLang('nl')"> NE</button>
            <button class="opt-btn" onclick="setLang('ru')"> </button>
            <button class="opt-btn" onclick="setLang('ar')"> </button>
            <button class="opt-btn" onclick="setLang('zh-CN')"> </button>
            <button class="opt-btn" onclick="setLang('ja')"> </button>
            <button class="opt-btn" onclick="setLang('ko')"> </button>
            <button class="opt-btn" onclick="setLang('hi')"> </button>
            </div>

        <button 
            onclick="fecharIdiomas()" 
            style="margin-top:15px; font-weight:bold; border:none; background:none; color:var(--green); cursor:pointer;"
        >
            FECHAR
        </button>
    </div>
</div>
    </div>

    <nav class="bottom-nav">
        <button class="b-btn" onclick="location.reload()"><span></span>HOME</button>
        <button class="b-btn" onclick="abrirResultados('Todos os Jogos', games)"><span></span>JOGOS</button>
        <button class="b-btn" onclick="window.open('https://youtube.com/@manguidx')"><span></span>PERFIL</button>
    </nav>

    <div id="google_translate_element"></div>
    <script src="jogos.js"></script>
    <script>
        let sIdx = 0;
        const canalVids = [{id: "CtvMlBuVnuY", t: "Spider-Man 2 Gameplay"}, {id: "m3ZYASNe2mE", t: "Cars: Fast as Lightning"}, {id: "AOpGdgE4yVA", t: "Oddworld"}];

        function carregarTudo() {
            if(!sessionStorage.getItem('lang-ok')) abrirIdiomas();
            if(typeof games === 'undefined') return;
            const shuf = [...games].sort(() => 0.5 - Math.random());
            
            // Slider com Cartaz Premium
            const s = document.getElementById('slider');
            shuf.slice(0,3).forEach(g => {
                s.innerHTML += `
                <div class="c-item" onclick="window.location.href='jogo.html?id=${g.id}'">
                    <img src="${g.image}" class="c-bg">
                    <div class="c-cartaz">
                        <img src="${g.image}" class="c-logo">
                        <div>
                            <span class="c-plat">${g.platform}</span>
                            <span class="c-title">${g.title}</span>
                        </div>
                    </div>
                </div>`;
            });
            setInterval(() => { sIdx=(sIdx+1)%3; s.style.transform=`translateX(-${sIdx*100}%)`; }, 5000);

            document.getElementById('main-list').innerHTML = shuf.slice(3,10).map(g => `
                <div style="display:flex; align-items:center; gap:15px; margin:18px 0;" onclick="window.location.href='jogo.html?id=${g.id}'">
                    <img src="${g.image}" class="sug-img">
                    <div style="flex:1;"><b style="font-size:16px;">${g.title}</b><br><small>${g.platform}</small></div>
                    <button style="background:var(--green); color:#fff; border:none; padding:8px 15px; border-radius:10px; font-weight:bold;">INSTALL</button>
                </div>`).join('');

            const pop = document.getElementById('pop-list');
            shuf.slice(10,20).forEach(g => {
                pop.innerHTML += `<div style="min-width:140px; text-align:center;" onclick="window.location.href='jogo.html?id=${g.id}'"><img src="${g.image}" class="pop-img"><div style="font-size:13px; font-weight:bold; margin-top:8px;">${g.title}</div></div>`;
            });

            setInterval(trocarVideoYT, 4500);
            trocarVideoYT();
        }

        function trocarVideoYT() {
            const v = canalVids[Math.floor(Math.random() * canalVids.length)];
            document.getElementById('yt-content').innerHTML = `<img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg" style="width:100%; border-radius:15px; border:2px solid #fff; margin-bottom:10px;" onclick="window.open('https://youtube.com/watch?v=${v.id}')"><div style="font-weight:bold; font-size:16px;">${v.t}</div>`;
        }

        function abrirIdiomas() { document.getElementById('lang-popup').style.display='flex'; }
        function fecharIdiomas() { document.getElementById('lang-popup').style.display='none'; document.body.style.overflow='auto'; }
        function setLang(l) { const combo = document.querySelector('.goog-te-combo'); if(combo) { combo.value = l; combo.dispatchEvent(new Event('change')); } sessionStorage.setItem('lang-ok', 't'); fecharIdiomas(); }
        function filtrarListaIdiomas() { const busca = document.getElementById('lang-search').value.toLowerCase(); document.querySelectorAll('#lang-grid .opt-btn').forEach(btn => btn.style.display = btn.innerText.toLowerCase().includes(busca) ? 'block' : 'none'); }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script>function googleTranslateElementInit(){new google.translate.TranslateElement({pageLanguage:'en'},'google_translate_element')}</script>
</body>
</html>
