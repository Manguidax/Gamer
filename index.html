<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mangui Dx Hub - Games & Movies</title>

    <style>
        :root { 
            --bg: #f1f3f4; 
            --card: #ffffff; 
            --border: #dadce0; 
            --text: #202124; 
            --green: #01875f; 
            --yt-red: #ff0000; 
            --accent: #01875f;
        }

        .dark-mode { 
            --bg: #080a0c; 
            --card: #111418; 
            --border: #1e242b; 
            --text: #ffffff; 
            --green: #3b82f6; 
            --accent: #3b82f6;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding-bottom: 95px;
            background: var(--bg);
            color: var(--text);
            transition: 0.3s;
            overflow-x: hidden;
        }

        header {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            padding: 12px 15px;
            background: var(--card);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
            gap: 10px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg);
            border-radius: 25px;
            padding: 6px 15px;
            border: 1px solid var(--border);
        }

        .search-box input {
            width: 100%;
            border: none;
            background: none;
            color: var(--text);
            outline: none;
            font-size: 15px;
        }

        .search-btn,
        .theme-btn {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-btn {
            font-size: 24px;
            line-height: 1;
            padding: 2px 0 2px 8px;
        }

        .theme-btn {
            font-size: 22px;
            padding: 4px;
        }

        /* TABS SELECTOR */
        .type-tabs {
            display: flex;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 0 15px;
        }

        .type-tab {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            color: #5f6368;
        }

        .type-tab.active {
            color: var(--green);
            border-bottom-color: var(--green);
        }

        .sub-nav {
            display: flex;
            gap: 18px;
            padding: 12px 15px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .sub-item {
            font-size: 14px;
            font-weight: bold;
            color: #5f6368;
            white-space: nowrap;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* CAROUSEL */
        .carousel-wrap {
            padding: 15px;
            overflow: hidden;
            position: relative;
        }

        .carousel {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .c-item {
            min-width: 100%;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            height: 210px;
            cursor: pointer;
        }

        .c-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.6);
        }

        .c-cartaz {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            padding: 12px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .c-logo {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            border: 2px solid #fff;
            object-fit: cover;
        }

        .c-plat {
            background: var(--green);
            color: #fff;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 3px;
            display: inline-block;
        }

        .c-title {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            display: block;
        }

        /* LISTS */
        .pop-img {
            width: 130px;
            height: 130px;
            border-radius: 22px;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .sug-img {
            width: 65px;
            height: 65px;
            border-radius: 14px;
            object-fit: cover;
        }

        /* POPUPS */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 5000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal {
            background: var(--card);
            width: 90%;
            max-width: 400px;
            border-radius: 25px;
            padding: 20px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .grid-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            overflow-y: auto;
            padding: 10px 0;
        }

        .opt-btn {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-weight: bold;
            cursor: pointer;
            text-transform: capitalize;
        }

        /* RESULTS GRID */
        .results-list {
            overflow-y: auto;
            flex: 1;
            text-align: left;
        }

        .res-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .yt-section {
            background: var(--yt-red);
            padding: 25px 15px;
            margin-top: 25px;
            color: #fff;
            text-align: center;
        }

        .btn-yt {
            background: #fff;
            color: var(--yt-red);
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        /* BOTTOM NAVIGATION */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--card);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid var(--border);
            height: 75px;
            z-index: 1000;
        }

        .b-btn {
            background: none;
            border: none;
            color: #5f6368;
            font-size: 11px;
            font-weight: bold;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .b-btn span {
            font-size: 23px;
            line-height: 1;
            font-weight: normal;
        }

        #google_translate_element {
            display: none !important;
        }
    </style>
</head>

<body onload="initializeApp()">

    <!-- HEADER -->
    <header>

        <b style="color:var(--green); font-size:20px;">
            Mangui Dx
        </b>

        <div class="search-box">
            <input
                type="text"
                id="top-search"
                placeholder="Search games or movies..."
                onkeypress="if(event.key==='Enter') search(this.value)"
            >

            <button
                class="search-btn"
                onclick="search(document.getElementById('top-search').value)"
                aria-label="Search"
            >⌕</button>
        </div>

        <button
            class="theme-btn"
            onclick="document.body.classList.toggle('dark-mode')"
            aria-label="Toggle dark mode"
        >◐</button>

    </header>

    <!-- NAVIGATION TABS -->
    <div class="type-tabs">

        <div
            class="type-tab active"
            id="tab-games"
            onclick="switchSection('games')"
        >
            ▣ GAMES
        </div>

        <div
            class="type-tab"
            id="tab-movies"
            onclick="switchSection('movies')"
        >
            ▤ MOVIES
        </div>

    </div>

    <!-- SUB NAVIGATION -->
    <nav class="sub-nav">

        <span
            class="sub-item"
            onclick="renderSection()"
        >
            For You
        </span>

        <span
            class="sub-item"
            onclick="showFilter('category')"
        >
            Categories
        </span>

        <span
            class="sub-item"
            id="filter-platform-btn"
            onclick="showFilter('platform')"
        >
            Platforms
        </span>

        <span
            class="sub-item"
            onclick="openLanguages()"
        >
            Language
        </span>

    </nav>

    <!-- CAROUSEL -->
    <div class="carousel-wrap">
        <div class="carousel" id="slider"></div>
    </div>

    <!-- RECOMMENDED -->
    <h3
        style="padding:0 15px; font-size:18px; color:var(--green);"
        id="sec-title-rec"
    >
        Recommended for you
    </h3>

    <div
        id="main-list"
        style="padding:0 15px;"
    ></div>

    <!-- TOP CHARTS -->
    <h3
        style="padding:15px; font-size:18px; color:var(--green);"
        id="sec-title-pop"
    >
        Top Charts
    </h3>

    <div
        style="display:flex; overflow-x:auto; padding:0 15px 15px 15px; gap:15px; scrollbar-width:none;"
        id="pop-list"
    ></div>

    <!-- RESULTS POPUP -->
    <div id="res-popup" class="overlay">

        <div class="modal">

            <h3 id="res-title">Results</h3>

            <div
                id="res-content"
                class="results-list"
            ></div>

            <button
                onclick="closePopups()"
                style="margin-top:15px; color:var(--green); border:none; background:none; font-weight:bold; cursor:pointer;"
            >
                × CLOSE
            </button>

        </div>
    </div>

    <!-- LANGUAGE POPUP -->
    <div id="lang-popup" class="overlay">

        <div class="modal">

            <h3>Select Language</h3>

            <div class="grid-options">

                <button
                    class="opt-btn"
                    onclick="setLang('en')"
                >
                    EN
                </button>

                <button
                    class="opt-btn"
                    onclick="setLang('pt')"
                >
                    PT
                </button>

                <button
                    class="opt-btn"
                    onclick="setLang('es')"
                >
                    ES
                </button>

                <button
                    class="opt-btn"
                    onclick="setLang('fr')"
                >
                    FR
                </button>

            </div>

            <button
                onclick="closePopups()"
                style="margin-top:15px; color:var(--green); border:none; background:none; font-weight:bold; cursor:pointer;"
            >
                × CLOSE
            </button>

        </div>
    </div>

    <!-- YOUTUBE SECTION -->
    <div class="yt-section">

        <h2>CHANNEL VIDEOS</h2>

        <div id="yt-content"></div>

        <button
            class="btn-yt"
            onclick="window.open('https://youtube.com/@manguidx')"
        >
            ▶ YouTube Channel
        </button>

    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">

        <button
            class="b-btn"
            onclick="switchSection('games')"
        >
            <span>⌂</span>
            GAMES
        </button>

        <button
            class="b-btn"
            onclick="switchSection('movies')"
        >
            <span>▤</span>
            MOVIES
        </button>

        <button
            class="b-btn"
            onclick="openResults('Catalog', getCurrentList())"
        >
            <span>☷</span>
            CATALOG
        </button>

        <button
            class="b-btn"
            onclick="window.open('https://youtube.com/@manguidx')"
        >
            <span>▶</span>
            CHANNEL
        </button>

    </nav>

    <div id="google_translate_element"></div>

    <!-- DATA SCRIPTS -->
    <script src="jogos.js"></script>
    <script src="filmes.js"></script>

    <script>

        let sIdx = 0;
        let sliderInterval;
        let currentSection = 'games';

        const canalVids = [
            {id: "CtvMlBuVnuY", t: "Spider-Man 2"}, 
            {id: "m3ZYASNe2mE", t: "Cars Fast"}, 
            {id: "AOpGdgE4yVA", t: "Oddworld"}
        ];

        function getCurrentList() {

            if (currentSection === 'movies') {
                return (typeof movies !== 'undefined') ? movies : [];
            }

            return (typeof games !== 'undefined') ? games : [];
        }

        function getDestinationUrl(item) {

            return currentSection === 'movies'
                ? `filmes.html?id=${item.id}`
                : `jogo.html?id=${item.id}`;
        }

        function switchSection(section) {

            currentSection = section;

            document
                .getElementById('tab-games')
                .classList
                .toggle('active', section === 'games');

            document
                .getElementById('tab-movies')
                .classList
                .toggle('active', section === 'movies');

            document.getElementById('filter-platform-btn').innerText =
                section === 'movies'
                    ? 'QUALITY'
                    : 'PLATFORMS';

            renderSection();
        }

        function initializeApp() {

            if (!sessionStorage.getItem('lang-ok')) {
                openLanguages();
            }

            renderSection();
            changeYTVideo();
        }

        function renderSection() {

            const list = getCurrentList();

            const s = document.getElementById('slider');
            const mainList = document.getElementById('main-list');
            const popList = document.getElementById('pop-list');

            s.innerHTML = '';
            mainList.innerHTML = '';
            popList.innerHTML = '';

            if (sliderInterval) {
                clearInterval(sliderInterval);
            }

            if (!list || list.length === 0) {

                mainList.innerHTML =
                    `<p style="text-align:center; color:#888;">
                        No items available at the moment.
                    </p>`;

                return;
            }

            const shuf = [...list]
                .sort(() => 0.5 - Math.random());

            /* SLIDER */

            shuf.slice(0, 3).forEach(item => {

                const tagInfo =
                    item.platform ||
                    item.quality ||
                    item.year ||
                    'HD';

                s.innerHTML += `
                    <div
                        class="c-item"
                        onclick="window.location.href='${getDestinationUrl(item)}'"
                    >

                        <img
                            src="${item.image}"
                            class="c-bg"
                        >

                        <div class="c-cartaz">

                            <img
                                src="${item.image}"
                                class="c-logo"
                            >

                            <div>
                                <span class="c-plat">
                                    ${tagInfo}
                                </span>

                                <span class="c-title">
                                    ${item.title}
                                </span>
                            </div>

                        </div>

                    </div>
                `;
            });

            sIdx = 0;
            s.style.transform = `translateX(0%)`;

            if (shuf.length > 1) {

                sliderInterval = setInterval(() => {

                    sIdx =
                        (sIdx + 1) %
                        Math.min(3, shuf.length);

                    s.style.transform =
                        `translateX(-${sIdx * 100}%)`;

                }, 5000);
            }

            /* RECOMMENDED */

            const actionBtnText =
                currentSection === 'movies'
                    ? 'WATCH'
                    : 'INSTALL';

            mainList.innerHTML =
                shuf.slice(3, 10).map(item => {

                    const subInfo =
                        item.platform ||
                        item.category ||
                        item.genre ||
                        '';

                    return `
                        <div
                            class="res-item"
                            onclick="window.location.href='${getDestinationUrl(item)}'"
                        >

                            <img
                                src="${item.image}"
                                class="sug-img"
                            >

                            <div style="flex:1;">
                                <b style="font-size:15px;">
                                    ${item.title}
                                </b>

                                <br>

                                <small>
                                    ${subInfo}
                                </small>
                            </div>

                            <button
                                style="background:var(--green); color:#fff; border:none; padding:6px 12px; border-radius:8px; font-weight:bold;"
                            >
                                ${actionBtnText}
                            </button>

                        </div>
                    `;

                }).join('');

            /* TOP CHARTS */

            shuf.slice(10, 20).forEach(item => {

                popList.innerHTML += `
                    <div
                        style="min-width:130px; text-align:left; cursor:pointer;"
                        onclick="window.location.href='${getDestinationUrl(item)}'"
                    >

                        <img
                            src="${item.image}"
                            class="pop-img"
                        >

                        <div
                            style="font-size:12px; font-weight:500; margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"
                        >
                            ${item.title}
                        </div>

                    </div>
                `;
            });
        }

        function openResults(title, list) {

            document.getElementById('res-title').innerText = title;

            const content =
                document.getElementById('res-content');

            content.innerHTML =
                list.map(item => `

                    <div
                        class="res-item"
                        onclick="window.location.href='${getDestinationUrl(item)}'"
                    >

                        <img
                            src="${item.image}"
                            style="width:50px; height:50px; border-radius:10px; object-fit:cover;"
                        >

                        <div>
                            <b>${item.title}</b>
                            <br>
                            <small>
                                ${item.platform ||
                                  item.category ||
                                  item.quality ||
                                  ''}
                            </small>
                        </div>

                    </div>

                `).join('');

            document.getElementById('res-popup').style.display = 'flex';
        }

        function showFilter(type) {

            const list = getCurrentList();

            const filterKey =
                (currentSection === 'movies' &&
                 type === 'platform')
                    ? 'quality'
                    : type;

            const items =
                [...new Set(
                    list
                        .map(item => item[filterKey])
                        .filter(Boolean)
                )];

            document.getElementById('res-title').innerText =
                type === 'category'
                    ? 'Categories'
                    : (currentSection === 'movies'
                        ? 'Quality'
                        : 'Platforms');

            const content =
                document.getElementById('res-content');

            content.innerHTML =
                `<div class="grid-options">` +

                items.map(item => `
                    <button
                        class="opt-btn"
                        onclick="filterBy('${filterKey}', '${item}')"
                    >
                        ${item}
                    </button>
                `).join('') +

                `</div>`;

            document.getElementById('res-popup').style.display = 'flex';
        }

        function filterBy(type, value) {

            const list = getCurrentList();

            const filtered =
                list.filter(item => item[type] === value);

            openResults(value, filtered);
        }

        function search(val) {

            const term = val.toLowerCase();

            const allItems = [
                ...(typeof games !== 'undefined' ? games : []),
                ...(typeof movies !== 'undefined' ? movies : [])
            ];

            const results =
                allItems.filter(item =>

                    (item.title &&
                     item.title.toLowerCase().includes(term)) ||

                    (item.category &&
                     item.category.toLowerCase().includes(term)) ||

                    (item.genre &&
                     item.genre.toLowerCase().includes(term))
                );

            openResults('Search: ' + val, results);
        }

        function changeYTVideo() {

            const v =
                canalVids[
                    Math.floor(
                        Math.random() *
                        canalVids.length
                    )
                ];

            document.getElementById('yt-content').innerHTML = `

                <img
                    src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg"
                    style="width:100%; border-radius:15px; margin-bottom:10px; cursor:pointer;"
                    onclick="window.open('https://youtube.com/watch?v=${v.id}')"
                >

                <b>${v.t}</b>
            `;
        }

        function openLanguages() {
            document.getElementById('lang-popup').style.display = 'flex';
        }

        function closePopups() {

            document
                .querySelectorAll('.overlay')
                .forEach(p => p.style.display = 'none');
        }

        function setLang(l) {

            const combo =
                document.querySelector('.goog-te-combo');

            if (combo) {

                combo.value = l;

                combo.dispatchEvent(
                    new Event('change')
                );
            }

            sessionStorage.setItem('lang-ok', 't');

            closePopups();
        }

        function googleTranslateElementInit() {

            new google.translate.TranslateElement(
                {
                    pageLanguage: 'en'
                },
                'google_translate_element'
            );
        }

    </script>

    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
